<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Security Patrol QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .page {
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 26px 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      text-align: center;
    }

    .eyebrow {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #52606d;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 28px;
    }

    .expected {
      margin: 16px 0 20px;
      padding: 16px;
      border: 2px solid #1f2937;
      border-radius: 12px;
    }

    .expected .point {
      font-size: 30px;
      font-weight: 800;
    }

    .expected .name {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 700;
    }

    #reader {
      width: 100%;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 12px;
    }

    .message {
      margin-top: 18px;
      font-size: 17px;
      line-height: 1.5;
    }

    .ok { color: #166534; }
    .warn { color: #92400e; }
    .error { color: #b91c1c; }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #1f2937;
      color: white;
    }

    .secondary {
      background: #6b7280;
    }

    .small {
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.45;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <div class="eyebrow">SECURITY PATROL</div>
    <h1>SCAN NEXT CHECKPOINT</h1>

    <div class="expected">
      <div id="expectedPoint" class="point">POINT</div>
      <div id="expectedName" class="name"></div>
    </div>

    <div id="reader"></div>

    <div id="message" class="message">
      Starting camera...
    </div>

    <button id="retryButton"
            class="hidden"
            onclick="retryScannerWithVoice()">
      TRY CAMERA AGAIN
    </button>

    <button class="secondary"
            onclick="goBackToPatrol()">
      BACK TO PATROL
    </button>

    <div class="small">
      Camera access is required only to scan the physical checkpoint QR.
      GPS verification still occurs on the patrol page after scanning.
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const expected = Number(params.get('expected'));
  const expectedName = params.get('name') || '';
  const returnUrl = params.get('return') || '';
  const voiceEnabled = params.get('voice') !== '0';

  let scanner = null;
  let scannerRunning = false;
  let detectionLocked = false;

  document.getElementById('expectedPoint').textContent =
    Number.isInteger(expected) ? 'POINT ' + expected : 'CHECKPOINT';

  document.getElementById('expectedName').textContent = expectedName;

  window.addEventListener('load', startScanner);


  function scannerVoiceSupported() {
    return (
      voiceEnabled &&
      'speechSynthesis' in window &&
      'SpeechSynthesisUtterance' in window
    );
  }


  function speakScanner(text, waitForFinish) {
    return new Promise(function(resolve) {
      if (!scannerVoiceSupported() || !text) {
        resolve();
        return;
      }

      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance =
          new SpeechSynthesisUtterance(String(text));

        utterance.lang = 'en-MY';
        utterance.rate = 0.95;
        utterance.pitch = 1;
        utterance.volume = 1;

        const voices = window.speechSynthesis.getVoices();

        const preferredVoice =
          voices.find(function(voice) {
            return String(voice.lang || '').toLowerCase() === 'en-my';
          }) ||
          voices.find(function(voice) {
            return String(voice.lang || '').toLowerCase().indexOf('en-gb') === 0;
          }) ||
          voices.find(function(voice) {
            return String(voice.lang || '').toLowerCase().indexOf('en') === 0;
          });

        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }

        let finished = false;

        function done() {
          if (finished) return;
          finished = true;
          resolve();
        }

        utterance.onend = done;
        utterance.onerror = done;

        window.speechSynthesis.speak(utterance);

        if (!waitForFinish) {
          setTimeout(done, 150);
        } else {
          setTimeout(done, 1400);
        }

      } catch (ignored) {
        resolve();
      }
    });
  }


  async function retryScannerWithVoice() {
    await speakScanner('Scanning checkpoint.', false);
    startScanner();
  }


  async function startScanner() {
    detectionLocked = false;

    if (!window.isSecureContext) {
      showError(
        'Camera requires HTTPS. This scanner page must be hosted on a secure HTTPS address.'
      );
      return;
    }

    if (!navigator.onLine) {
      showError(
        'No internet connection. Reconnect before scanning the next checkpoint.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showError(
        'QR scanner library could not load. Refresh the page and try again.'
      );
      return;
    }

    document.getElementById('retryButton').classList.add('hidden');
    setMessage('Opening rear camera...', '');

    try {
      scanner = new Html5Qrcode('reader');
      scannerRunning = true;

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 260, height: 260 },
          aspectRatio: 1.0
        },
        onQrDetected,
        function() {}
      );

      setMessage(
        'Camera ready. Point it at the physical checkpoint QR code.',
        ''
      );

    } catch (error) {
      scannerRunning = false;
      scanner = null;

      showError(
        'Camera access was not granted or the camera could not start. Allow camera permission in the browser and try again.'
      );
    }
  }


  async function onQrDetected(decodedText) {
    if (detectionLocked) return;

    const scannedPoint = extractPoint(decodedText);

    if (!Number.isInteger(scannedPoint)) {
      setMessage(
        'This is not a valid patrol checkpoint QR. Scan the checkpoint QR code.',
        'warn'
      );
      return;
    }

    if (!returnUrl) {
      showError('Patrol return address is missing.');
      return;
    }

    detectionLocked = true;

    // Keep the guard-facing scanner simple.
    // Sequence and audit decisions are handled by Apps Script.
    setMessage('Checkpoint scanned. Verifying checkpoint...', 'ok');

    await stopScanner();

    // Speak before navigation so the browser has time to finish the phrase.
    await speakScanner(
      'Checkpoint scanned. Verifying checkpoint.',
      true
    );

    // Any valid patrol checkpoint is returned to Apps Script.
    // Apps Script decides whether it is ACCEPTED, DUPLICATE, or SKIPPED,
    // and records the event in Patrol_Log.
    // The scanned QR's own destination is never opened.
    window.location.href =
      returnUrl +
      '?point=' +
      encodeURIComponent(scannedPoint) +
      '&voice=' +
      encodeURIComponent(voiceEnabled ? '1' : '0');
  }


  function extractPoint(text) {
    try {
      const parsed = new URL(text);
      const point = Number(parsed.searchParams.get('point'));

      if (Number.isInteger(point) && point >= 1 && point <= 999) {
        return point;
      }
    } catch (ignored) {}

    const plain = String(text || '').trim();

    if (/^\d{1,3}$/.test(plain)) {
      return Number(plain);
    }

    const match = plain.match(/(?:point|cp)\s*[-:#]?\s*(\d{1,3})/i);

    if (match) {
      return Number(match[1]);
    }

    return null;
  }


  async function stopScanner() {
    if (scanner && scannerRunning) {
      try {
        await scanner.stop();
      } catch (ignored) {}
    }

    if (scanner) {
      try {
        scanner.clear();
      } catch (ignored) {}
    }

    scannerRunning = false;
    scanner = null;
  }


  async function goBackToPatrol() {
    await stopScanner();

    if (returnUrl && Number.isInteger(expected)) {
      window.location.href =
        returnUrl +
        '?point=' +
        encodeURIComponent(expected);
      return;
    }

    history.back();
  }


  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text || '';
    el.className = 'message' + (type ? ' ' + type : '');
  }


  function showError(text) {
    setMessage(text, 'error');
    document.getElementById('retryButton').classList.remove('hidden');
  }
</script>
</body>
</html>
